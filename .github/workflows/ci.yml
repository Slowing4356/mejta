# Builds every Mejta project against Minecraft and runs the unit tests on every push to main and every pull
# request (documentation-only changes skip it). MejtaCore builds first; the addons then build side by side, each
# in its own job, against the MejtaCore it published.
#
# The client game tests (a real client against a dedicated server, under a virtual display) only run on demand:
# Actions > CI > Run workflow, then choose one project (or "all"). Run them for the projects a change touches, in its
# pull request; a release does not rerun them for every project.
name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]
  workflow_dispatch:
    inputs:
      game_tests:
        description: Client game tests to run
        type: choice
        default: none
        options: [ none, all, mejta-core/test-addon, mejta-ac, mejta-utils, mejta-discord, mejta-perf, mejta-corpse, mejta-smp ]
      full:
        description: Also run the suites of older checks (MejtaAC stages 4 and 5, every latency profile)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A newer push replaces a running build; a manual run with game tests is never cancelled by one.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  core:
    name: MejtaCore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, publish to Maven Local
        working-directory: mejta-core
        run: bash ./gradlew test build publishToMavenLocal --stacktrace
      # compileGametestJava: the client game tests only run on demand, but they must always compile.
      - name: Test addon
        working-directory: mejta-core/test-addon
        run: bash ./gradlew build compileGametestJava --stacktrace
      # The addon jobs (and game tests) compile against this copy instead of building MejtaCore again.
      - uses: actions/upload-artifact@v4
        with:
          name: mejtacore-maven
          path: /home/runner/.m2/repository/com/mejta/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: jars-mejta-core
          path: |
            mejta-core/build/libs/*.jar
            !mejta-core/build/libs/*-sources.jar
            !mejta-core/build/libs/*-javadoc.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports-mejta-core
          path: mejta-core/build/reports/tests/
          if-no-files-found: ignore

  addon:
    name: ${{ matrix.project }}
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mejta-ac
            tasks: test build compileGametestJava
          - project: mejta-utils
            tasks: test build compileGametestJava
          - project: mejta-discord
            tasks: test build compileGametestJava
          - project: mejta-perf
            tasks: test build compileGametestJava
          # The headless server game tests take about a minute each, so they run with every build.
          - project: mejta-qol
            tasks: test build runGameTest
          - project: mejta-corpse
            tasks: test build runGameTest
          - project: mejta-smp
            tasks: test build runGameTest
          - project: mejta-economy
            tasks: test build runGameTest
          - project: mejta-market
            tasks: test build runGameTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: mejtacore-maven
          path: /home/runner/.m2/repository/com/mejta/
      - name: Build and test
        working-directory: ${{ matrix.project }}
        run: bash ./gradlew ${{ matrix.tasks }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.project }}
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar
            !${{ matrix.project }}/build/libs/*-javadoc.jar
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports-${{ matrix.project }}
          path: ${{ matrix.project }}/build/reports/tests/
          if-no-files-found: ignore

  # One check that is green only when MejtaCore and every addon built and passed (the name older runs used).
  build:
    name: Build and unit tests
    needs: [ core, addon ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every project passed
        run: |
          [ "${{ needs.core.result }}" = success ] && [ "${{ needs.addon.result }}" = success ]

  gametest:
    name: Game tests (${{ matrix.project }})
    needs: core
    if: github.event_name == 'workflow_dispatch' && inputs.game_tests != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.game_tests == 'all' && '["mejta-core/test-addon","mejta-ac","mejta-utils","mejta-discord","mejta-perf","mejta-corpse","mejta-smp"]' || format('["{0}"]', inputs.game_tests)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: mejtacore-maven
          path: /home/runner/.m2/repository/com/mejta/
      - name: Virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      - name: Client game test
        working-directory: ${{ matrix.project }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bash ./gradlew runClientGameTest ${{ inputs.full && '-PfullGameTests' || '' }} --stacktrace
      - name: Name the log artifact
        if: always()
        id: name
        run: echo "name=gametest-logs-$(echo '${{ matrix.project }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ matrix.project }}/build/run/clientGameTest/logs/
            ${{ matrix.project }}/build/run/clientGameTest/crash-reports/
            ${{ matrix.project }}/build/run/clientGameTest/screenshots/
            ${{ matrix.project }}/build/run/clientGameTest/*.md
            ${{ matrix.project }}/run/logs/
          if-no-files-found: ignore
