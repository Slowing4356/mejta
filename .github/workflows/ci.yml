# Builds every Mejta project against Minecraft and runs the unit tests: a few minutes, on every push to
# main and every pull request (documentation-only changes skip it).
#
# The client game tests (a real client against a dedicated server, under a virtual display) take up to
# half an hour, MejtaAC's latency suites most of it, so they only run on demand: Actions > CI > Run workflow,
# then choose "all" or one project. Run them before tagging a release.
#
# Projects build in dependency order: MejtaCore is published to the runner's Maven Local first, and the
# addons compile against that copy. Nothing is published outside the runner.
name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]
  workflow_dispatch:
    inputs:
      game_tests:
        description: Client game tests to run
        type: choice
        default: none
        options: [ none, all, mejta-core/test-addon, mejta-ac, mejta-utils, mejta-discord, mejta-perf, mejta-corpse, mejta-smp ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A newer push replaces a running build; a manual run with game tests is never cancelled by one.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: MejtaCore
        working-directory: mejta-core
        run: bash ./gradlew test build publishToMavenLocal --stacktrace
      - name: MejtaCore test addon
        working-directory: mejta-core/test-addon
        run: bash ./gradlew build --stacktrace
      - name: MejtaAC
        working-directory: mejta-ac
        run: bash ./gradlew test build --stacktrace
      - name: MejtaUtils
        working-directory: mejta-utils
        run: bash ./gradlew test build --stacktrace
      - name: MejtaDiscord
        working-directory: mejta-discord
        run: bash ./gradlew test build --stacktrace
      - name: MejtaPerf
        working-directory: mejta-perf
        run: bash ./gradlew test build --stacktrace
      # MejtaQoL's, MejtaCorpse's and MejtaSMP's server game tests are headless (about a minute each), so they
      # run with every build.
      - name: MejtaQoL
        working-directory: mejta-qol
        run: bash ./gradlew test build runGameTest --stacktrace
      - name: MejtaCorpse
        working-directory: mejta-corpse
        run: bash ./gradlew test build runGameTest --stacktrace
      - name: MejtaSMP
        working-directory: mejta-smp
        run: bash ./gradlew test build runGameTest --stacktrace
      - name: Collect jars
        if: always()
        run: |
          mkdir -p dist
          for p in mejta-core mejta-ac mejta-utils mejta-discord mejta-perf mejta-qol mejta-corpse mejta-smp; do
            [ -d "$p/build/libs" ] || continue
            find "$p/build/libs" -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mejta-jars
          path: dist/*.jar
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: '*/build/reports/tests/'
          if-no-files-found: ignore

  gametest:
    name: Game tests (${{ matrix.project }})
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.game_tests != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.game_tests == 'all' && '["mejta-core/test-addon","mejta-ac","mejta-utils","mejta-discord","mejta-perf","mejta-corpse","mejta-smp"]' || format('["{0}"]', inputs.game_tests)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Publish MejtaCore to Maven Local
        working-directory: mejta-core
        run: bash ./gradlew publishToMavenLocal --stacktrace
      - name: Client game test
        working-directory: ${{ matrix.project }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bash ./gradlew runClientGameTest --stacktrace
      - name: Name the log artifact
        if: always()
        id: name
        run: echo "name=gametest-logs-$(echo '${{ matrix.project }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ matrix.project }}/build/run/clientGameTest/logs/
            ${{ matrix.project }}/build/run/clientGameTest/crash-reports/
            ${{ matrix.project }}/build/run/clientGameTest/screenshots/
            ${{ matrix.project }}/run/logs/
          if-no-files-found: ignore
