# Publishes a GitHub release with the jars of every Mejta mod when a tag such as `v2026.10.0` is pushed.
# Everything is built and unit-tested again from the tagged commit; the release notes are RELEASE-NOTES.md.
# Game tests are not repeated here: the tagged commit should already have passed CI.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          set -e
          (cd mejta-core && bash ./gradlew test build publishToMavenLocal --stacktrace)
          for p in mejta-ac mejta-utils mejta-discord mejta-perf; do
            (cd "$p" && bash ./gradlew test build --stacktrace)
          done
      - name: Collect jars
        run: |
          mkdir -p dist
          for p in mejta-core mejta-ac mejta-utils mejta-discord mejta-perf; do
            find "$p/build/libs" -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          done
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt --title "Mejta $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md --verify-tag
