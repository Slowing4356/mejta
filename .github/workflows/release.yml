# Publishes a GitHub release when a tag such as `v2026.10.0` is pushed. The mods listed in RELEASED are built
# and unit-tested again from the tagged commit and their jars attached; the release notes are RELEASE-NOTES.md.
# Game tests are not repeated here: new features get their client game tests in their pull request
# (Actions > CI > Run workflow, for the projects they change).
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, for example v2026.10.0
        required: true

permissions:
  contents: write

env:
  # Released mods; MejtaCore is always built first, since the addons compile against it.
  RELEASED: mejta-core mejta-ac mejta-utils mejta-discord mejta-perf mejta-qol mejta-corpse mejta-smp mejta-economy mejta-market

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          set -e
          (cd mejta-core && bash ./gradlew test build publishToMavenLocal --stacktrace)
          for p in $RELEASED; do
            [ "$p" = mejta-core ] || (cd "$p" && bash ./gradlew test build --stacktrace)
          done
      - name: Collect jars
        run: |
          mkdir -p dist
          for p in $RELEASED; do
            find "$p/build/libs" -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;
          done
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A release made by hand on GitHub for the same tag is reused: its notes are replaced and the jars attached.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Mejta $TAG" --notes-file RELEASE-NOTES.md
            gh release upload "$TAG" dist/*.jar dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.jar dist/SHA256SUMS.txt --title "Mejta $TAG" --notes-file RELEASE-NOTES.md --verify-tag
          fi
