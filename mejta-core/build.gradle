plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft, Fabric and Mojang repositories automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mejtacore" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is a required runtime dependency (players install it separately).
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	withJavadocJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

javadoc {
	// Only the public API (common + client) is documented; other packages are internal.
	source = sourceSets.main.allJava + sourceSets.client.allJava
	classpath = files(sourceSets.main.compileClasspath, sourceSets.client.compileClasspath,
			sourceSets.main.output, sourceSets.client.output)
	include "com/mejta/mejtacore/api/**"
	options.encoding = "UTF-8"
	(options as StandardJavadocDocletOptions).addStringOption("Xdoclint:none", "-quiet")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// `./gradlew publishToMavenLocal` publishes to ~/.m2 for local addon development.
		// Add a remote repository here when MejtaCore is distributed publicly.
	}
}
